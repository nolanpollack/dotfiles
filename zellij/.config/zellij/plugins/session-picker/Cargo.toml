[package]
name = "session-picker"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["agent-core", "agent-bridge"]
resolver = "2"

[dependencies]
zellij-tile = "0.44.3"
fuzzy-matcher = "0.3"
ratatui = { version = "0.30", default-features = false }
agent-core = { path = "agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
